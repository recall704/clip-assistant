[package]
name = "clipassistant-app"
version = "0.1.0"
edition = "2021"
description = "ClipAssistant — GPUI desktop application"

[[bin]]
name = "clipassistant"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
clipassistant-core = { path = "../core" }
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
base64 = "0.22"
unicode-segmentation = "1"

[build-dependencies]
winresource = "0.1"
