[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]
# Run with `cargo run --manifest-path tools/icon-gen/Cargo.toml -- assets/icon.ico`.
exclude = ["tools/icon-gen"]

[workspace.package]
version = "0.2.1"
edition = "2021"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
